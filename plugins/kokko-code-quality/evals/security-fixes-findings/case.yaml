schema_version: "1.1"
name: security-fixes-findings
description: "A repo with three classic bandit findings ends with the findings fixed, committed as fix(security), staged by explicit path, and no dependency added to the project."
tags: [security, quality]
plugins: ["../.."]
runs: 2
execution:
  prompt: "/kokko-code-quality:security py"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: security-commit-made
    type: tool_used
    tool: Bash
    input_match: "git commit.*fix\\(security\\)"
    min: 1
  - name: staged-by-explicit-path
    type: tool_used
    tool: Bash
    input_match: "git add (\\.|-A|--all)( |$)"
    min: 0
    max: 0
  - name: no-dependency-added
    type: tool_used
    tool: Bash
    input_match: "(uv add|pip install|uv pip install)"
    min: 0
    max: 0
  - name: shell-injection-removed
    type: regex
    target: {source: file, path: app/runner.py}
    pattern: "shell=True"
    match: not_contains
  - name: unsafe-yaml-load-removed
    type: regex
    target: {source: file, path: app/config.py}
    pattern: "yaml\\.load\\("
    match: not_contains
  - name: findings-fixed-and-reported
    type: llm
    criteria: "PASS only if the final message reports that the scanner found the shell=True subprocess call, the yaml.load, and the MD5 hash, that each was fixed (args list without a shell, yaml.safe_load, sha256), and that a re-scan is clean. FAIL if any finding was suppressed instead of fixed, or if the agent claims a clean scan without running the scanner again."
