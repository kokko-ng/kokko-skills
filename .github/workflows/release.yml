name: Release

# release.yml is the SOLE publisher of GitHub releases: it fires after the CI
# workflow succeeds on main (or on manual dispatch). The /release command's
# job ends at the version bump + merge; no one runs `gh release create` by
# hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.6.0); created at the dispatched ref if it does not exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    # Only publish when dispatched manually or when CI concluded successfully
    # on main. A failed or cancelled CI run publishes nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Create GitHub release for the current version (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          # inputs.tag is passed through env, never interpolated into the
          # script, so a crafted tag cannot inject shell syntax.
          INPUT_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # All plugins version in lock-step; refuse to release a repo where
          # the marketplace entries disagree instead of trusting .plugins[0].
          distinct=$(jq -r '[.plugins[].version] | unique | length' .claude-plugin/marketplace.json)
          if [ "$distinct" -ne 1 ]; then
            echo "ERROR: marketplace.json plugin versions are not identical:"
            jq -r '.plugins[] | "  \(.name): \(.version)"' .claude-plugin/marketplace.json
            exit 1
          fi
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --generate-notes
